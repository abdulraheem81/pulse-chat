<script>
  // Dynamic Call Duration Timer
  let seconds = 868; // starts at 14:28
  const timerEl = document.getElementById('callTimer');
  if (timerEl) {
    setInterval(() => {
      seconds++;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }, 1000);
  }

  // Reactive Emoji Floating Spark Generator
  function spawnReaction(emoji) {
    const container = document.getElementById('reactionField');
    if (!container) return;

    const el = document.createElement('div');
    el.textContent = emoji;
    el.style.position = 'absolute';
    el.style.left = `${Math.floor(Math.random() * 60) + 20}%`;
    el.style.bottom = '20px';
    el.style.fontSize = '32px';
    el.style.transition = 'all 1.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
    el.style.opacity = '1';
    el.style.transform = `scale(0.6) translateY(0) rotate(${Math.random() * 30 - 15}deg)`;
    el.style.zIndex = '50';

    container.appendChild(el);

    requestAnimationFrame(() => {
      el.style.transform = `scale(1.4) translateY(-320px) rotate(${Math.random() * 40 - 20}deg)`;
      el.style.opacity = '0';
    });

    setTimeout(() => {
      el.remove();
    }, 1600);
  }

  // Microphone Active Toggle Interaction
  const micBtn = document.getElementById('toggleMicBtn');
  const micIcon = document.getElementById('micIcon');
  let isMicActive = true;

  if (micBtn && micIcon) {
    micBtn.addEventListener('click', () => {
      isMicActive = !isMicActive;
      if (isMicActive) {
        micBtn.className = 'w-[52px] h-[52px] rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg active:scale-95 transition-all';
        micIcon.textContent = 'mic';
      } else {
        micBtn.className = 'w-[52px] h-[52px] rounded-full bg-error-container text-on-error flex items-center justify-center shadow-lg active:scale-95 transition-all';
        micIcon.textContent = 'mic_off';
      }
    });
  }

  // Camera Toggle Interaction
  const camBtn = document.getElementById('toggleCamBtn');
  const camIcon = document.getElementById('camIcon');
  let isCamActive = true;

  if (camBtn && camIcon) {
    camBtn.addEventListener('click', () => {
      isCamActive = !isCamActive;
      if (isCamActive) {
        camBtn.className = 'w-[52px] h-[52px] rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center hover:text-primary active:scale-95 transition-all';
        camIcon.textContent = 'videocam';
      } else {
        camBtn.className = 'w-[52px] h-[52px] rounded-full bg-error-container text-on-error flex items-center justify-center active:scale-95 transition-all';
        camIcon.textContent = 'videocam_off';
      }
    });
  }

  // End Call Feedback Trigger
  const endCallBtn = document.getElementById('endCallBtn');
  if (endCallBtn) {
    endCallBtn.addEventListener('click', () => {
      if (confirm('Leave current video session?')) {
        history.back();
      }
    });
  }
</script></main></body></html>
